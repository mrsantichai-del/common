<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRON // Core System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CryptoJS CDN for AES-256 Symmetric Payload Encryption -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Sarabun', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-center items-center p-4 antialiased">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- ============================================================== -->
  <!-- VIEW 1: AUTHENTICATION / SIGN IN                               -->
  <!-- ============================================================== -->
  <div id="viewLogin" class="w-full max-w-sm">
    <div class="bg-white rounded-lg shadow-sm border border-slate-300 p-8">
      
      <!-- Brand Logo & Header -->
      <div class="text-center mb-6">
        <div class="w-10 h-10 bg-slate-900 text-white rounded-md flex items-center justify-center mx-auto mb-3 shadow-xs">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">เข้าสู่ระบบงาน</h1>
        <p class="text-xs text-slate-500 mt-0.5 font-mono">ULTRON CORE SYSTEM</p>
      </div>

      <!-- Quick Test Accounts Panel (Toggleable Developer Helper) -->
      <div id="loginDemoAccountsPanel" class="hidden mb-5 p-3 bg-slate-50 border border-slate-200 rounded-md">
        <div class="text-[11px] font-semibold text-slate-700 mb-2 flex items-center justify-between">
          <span>เลือกบัญชีทดสอบระบบ:</span>
          <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono">DEV MODE</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5 text-xs">
          <button type="button" onclick="quickLoginAs('root_admin')" class="p-2 bg-white hover:bg-slate-100 border border-slate-200 rounded text-left transition-colors cursor-pointer">
            <div class="font-semibold text-slate-800 text-[11px]">ผู้ดูแลระบบ</div>
            <div class="text-[10px] text-slate-500 font-mono">root_admin</div>
          </button>
          <button type="button" onclick="quickLoginAs('approver_ellen')" class="p-2 bg-white hover:bg-slate-100 border border-slate-200 rounded text-left transition-colors cursor-pointer">
            <div class="font-semibold text-slate-800 text-[11px]">ผู้อนุมัติเอกสาร</div>
            <div class="text-[10px] text-slate-500 font-mono">approver_ellen</div>
          </button>
          <button type="button" onclick="quickLoginAs('auditor_arthur')" class="p-2 bg-white hover:bg-slate-100 border border-slate-200 rounded text-left transition-colors cursor-pointer">
            <div class="font-semibold text-slate-800 text-[11px]">ผู้ตรวจสอบ</div>
            <div class="text-[10px] text-slate-500 font-mono">auditor_arthur</div>
          </button>
          <button type="button" onclick="quickLoginAs('hybrid_harry')" class="p-2 bg-white hover:bg-slate-100 border border-slate-200 rounded text-left transition-colors cursor-pointer">
            <div class="font-semibold text-slate-800 text-[11px]">เจ้าหน้าที่บันทึก</div>
            <div class="text-[10px] text-slate-500 font-mono">hybrid_harry</div>
          </button>
        </div>
      </div>

      <!-- Error Alert Box -->
      <div id="loginErrorMsg" class="hidden mb-4 p-2.5 rounded border border-rose-200 bg-rose-50 text-rose-700 text-xs"></div>

      <!-- Sign In Form -->
      <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label for="loginUsername" class="block text-xs font-medium text-slate-700 mb-1">
            ชื่อผู้ใช้งาน (Username)
          </label>
          <input 
            type="text" 
            id="loginUsername" 
            required 
            placeholder="เช่น root_admin"
            class="w-full px-3 py-2 rounded-md border border-slate-300 text-sm focus:ring-1 focus:ring-slate-900 focus:border-slate-900 outline-none transition-colors"
          />
        </div>

        <div>
          <label for="loginPassword" class="block text-xs font-medium text-slate-700 mb-1">
            รหัสผ่าน (Password)
          </label>
          <input 
            type="password" 
            id="loginPassword" 
            required 
            placeholder="รหัสผ่าน"
            class="w-full px-3 py-2 rounded-md border border-slate-300 text-sm focus:ring-1 focus:ring-slate-900 focus:border-slate-900 outline-none transition-colors"
          />
        </div>

        <button 
          type="submit" 
          id="btnLoginSubmit"
          class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs rounded-md transition-colors shadow-xs cursor-pointer"
        >
          เข้าสู่ระบบ (Sign In)
        </button>
      </form>

    </div>

    <!-- Toggle Demo Mode Button -->
    <div class="mt-4 text-center">
      <button 
        type="button" 
        onclick="toggleDemoMode()" 
        id="btnToggleDemoMode" 
        class="text-xs text-slate-500 hover:text-slate-800 transition-colors inline-flex items-center space-x-1.5 py-1 px-3 rounded-md border border-slate-300 bg-white shadow-2xs cursor-pointer"
        title="สลับโหมดทดสอบระบบสำหรับผู้พัฒนา"
      >
        <span>โหมดทดสอบระบบ:</span> <strong id="demoModeBadge" class="text-slate-600 font-mono">OFF</strong>
      </button>
    </div>

    <div class="mt-2 text-center text-[11px] text-slate-400">
      ระบบความปลอดภัยภายในเครื่อง (Local Sovereignty)
    </div>
  </div>

  <!-- ============================================================== -->
  <!-- VIEW 2: POST-LOGIN MINIMAL VIEW (WHO LOGGED IN + SIGN OUT)     -->
  <!-- ============================================================== -->
  <div id="viewApp" class="hidden w-full max-w-md">
    <div class="bg-white rounded-lg shadow-sm border border-slate-300 p-8 space-y-6">
      
      <!-- User Avatar & Status -->
      <div class="text-center">
        <div class="w-14 h-14 bg-slate-900 text-white rounded-full flex items-center justify-center mx-auto mb-3 text-lg font-mono font-bold shadow-xs" id="userAvatar">
          U
        </div>
        <div class="inline-flex items-center space-x-1.5 px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-medium mb-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>ลงชื่อเข้าสู่ระบบแล้ว</span>
        </div>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight" id="currentUsernameDisplay">
          -
        </h2>
      </div>

      <!-- User Identity Details -->
      <div class="bg-slate-50 rounded-md border border-slate-200 p-4 space-y-2.5 text-xs">
        <div class="flex items-center justify-between">
          <span class="text-slate-500">ชื่อผู้ใช้งาน:</span>
          <span class="font-mono font-semibold text-slate-800" id="detailUsername">-</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-500">กลุ่มสิทธิ์ / บทบาท:</span>
          <span class="font-mono font-semibold text-slate-800" id="detailRole">-</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-500">รหัสพนักงาน (Employee ID):</span>
          <span class="font-mono text-slate-700" id="detailEmployeeId">-</span>
        </div>
        <div class="flex items-center justify-between border-t border-slate-200 pt-2 text-[11px]">
          <span class="text-slate-400">เวลาเข้าสู่ระบบ:</span>
          <span class="font-mono text-slate-500" id="detailLoginTime">-</span>
        </div>
      </div>

      <!-- Sign Out Button -->
      <div>
        <button 
          type="button" 
          onclick="handleLogout()" 
          class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium rounded-md transition-colors cursor-pointer shadow-xs flex items-center justify-center space-x-2"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>ลงชื่อออกจากระบบ (Sign Out)</span>
        </button>
      </div>

    </div>

    <div class="mt-3 text-center text-[11px] text-slate-400">
      ULTRON Enterprise Minimal Core
    </div>
  </div>

  <!-- APPLICATION JAVASCRIPT SDK & UI LOGIC -->
  <script src="/js/api-client.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
