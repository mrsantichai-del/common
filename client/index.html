<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRON // Core System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Local Sovereign Stylesheet (Sarabun, JetBrains Mono, Scrollbar, A4 Print) -->
  <link rel="stylesheet" href="/css/styles.css">

  <!-- CryptoJS for AES-256 Symmetric Wire Payload Encryption (Local Sovereign Copy) -->
  <script src="/js/crypto-js.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- ============================================================== -->
  <!-- VIEW 1: AUTHENTICATION / CORPORATE SIGN IN                     -->
  <!-- ============================================================== -->
  <div id="viewLogin" class="min-h-screen flex flex-col justify-center items-center p-4 bg-slate-900/5 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:16px_16px]">
    <!-- Injected dynamically from /views/auth-login.html -->
    <div class="text-xs text-slate-400 font-mono animate-pulse">กำลังโหลดระบบลงชื่อเข้าใช้...</div>
  </div>

  <!-- ============================================================== -->
  <!-- VIEW 2: MAIN APPLICATION WORKSPACE WITH ROLE-BASED SIDEBAR     -->
  <!-- ============================================================== -->
  <div id="viewApp" class="hidden min-h-screen flex flex-col md:flex-row bg-slate-50">
    
    <!-- LEFT SIDEBAR NAVIGATION (ACCORDING TO PERMISSIONS) -->
    <aside id="sidebarNav" class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between flex-shrink-0 md:min-h-screen border-r border-slate-800 select-none">
      <!-- Injected dynamically from /views/sidebar.html -->
    </aside>

    <!-- RIGHT MAIN WORKSPACE -->
    <main class="flex-1 flex flex-col min-w-0">
      
      <!-- Top Workspace Header Bar -->
      <header class="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center space-x-3">
          <h1 id="pageTitle" class="text-sm font-bold text-slate-900 tracking-tight">
            หน้าหลัก (Home)
          </h1>
          <span class="text-slate-300">|</span>
          <span class="text-xs text-slate-500">ระบบงานหลักสำหรับผู้ใช้งานทุกหน้าที่</span>
        </div>

        <div class="flex items-center space-x-3 text-xs">
          <div class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-medium font-mono">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>PORT 3000 // READY</span>
          </div>
        </div>
      </header>

      <!-- Main Workspace Content Body -->
      <div class="flex-1 p-6 overflow-y-auto">
        
        <!-- SECTION 1: HOME PAGE (AUTHENTIC GREETING & CAPABILITIES) -->
        <div id="sectionHome" class="max-w-3xl mx-auto py-8 space-y-8">
          <!-- Injected dynamically from /views/view-home.html -->
        </div>

        <!-- SECTION 2: PLACEHOLDER FOR OTHER MODULES -->
        <div id="sectionPlaceholder" class="hidden max-w-xl mx-auto py-12 text-center space-y-4">
          <div class="w-14 h-14 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center mx-auto border border-slate-200">
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
            </svg>
          </div>
          <div>
            <h3 id="placeholderModuleTitle" class="text-base font-bold text-slate-900">-</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-md mx-auto">
              โมดูลนี้ถูกกำหนดสิทธิ์ไว้ในระบบแล้ว และพร้อมสำหรับการเริ่มพัฒนาตามคำสั่งของ Maker ในขั้นตอนถัดไป
            </p>
          </div>
          <div>
            <button 
              type="button" 
              onclick="navigateToMenu('home')" 
              class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs rounded transition-colors cursor-pointer"
            >
              กลับสู่หน้าหลัก (Back to Home)
            </button>
          </div>
        </div>

        <!-- SECTION 3: MASTERDATA (ADMIN ONLY - ALL TABLES MANAGEMENT) -->
        <div id="sectionMasterData" class="hidden space-y-4">
          <!-- Injected dynamically from /views/view-master-data.html -->
        </div>

      </div>

    </main>
  </div>

  <!-- MODAL: ADD / EDIT MASTER RECORD -->
  <div id="modalMasterForm" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4 overflow-y-auto">
    <!-- Injected dynamically from /views/modal-master-form.html -->
  </div>

  <!-- MODAL: FORMAL COMPANY PROFILE PRINT & PDF PREVIEW -->
  <div id="modalCompanyPrintPreview" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-xs flex flex-col z-50 p-2 md:p-6 overflow-y-auto">
    <!-- Injected dynamically from /views/modal-company-print.html -->
  </div>

  <!-- MODULAR JAVASCRIPT SDK & ARCHITECTURE -->
  <script src="/js/api-client.js?v=20261110_01"></script>
  <script src="/js/modules/ui.js?v=20261110_01"></script>
  <script src="/js/modules/auth.js?v=20261110_01"></script>
  <script src="/js/modules/navigation.js?v=20261110_01"></script>
  <script src="/js/modules/company-print.js?v=20261110_01"></script>
  <script src="/js/modules/master-data.js?v=20261110_01"></script>
  <script src="/js/app.js?v=20261110_01"></script>
</body>
</html>
