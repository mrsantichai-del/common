<!-- Top Section: Branding & Role & Dynamic Menu -->
<div>
  <!-- Brand Header with Official Flexible Logo -->
  <div class="px-4 py-3.5 border-b border-slate-800 flex items-center justify-between">
    <div class="flex items-center space-x-2.5 min-w-0">
      <div class="h-9 max-w-[130px] bg-white rounded px-2 py-1 flex items-center justify-center flex-shrink-0 shadow-2xs border border-slate-700/50">
        <img src="/assets/logo/logo.jpg" alt="Logo" class="brand-logo-img">
      </div>
      <div class="min-w-0">
        <div class="font-bold text-white text-xs tracking-tight leading-tight truncate">
          CORE SYSTEM
        </div>
        <div class="text-[9px] text-slate-400 font-mono truncate">Enterprise Edition</div>
      </div>
    </div>
  </div>

  <!-- Role Badge Display -->
  <div class="mx-3 mt-3 px-3 py-2 rounded bg-slate-800/80 border border-slate-700/80 flex items-center justify-between text-xs">
    <span class="text-[11px] text-slate-400 font-medium">กลุ่มสิทธิ์ของคุณ</span>
    <span id="sidebarUserRoleBadge" class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">
      -
    </span>
  </div>

  <!-- Dynamic Menu List (Populated via JS based on permissions) -->
  <div class="mt-4">
    <div class="px-4 pb-2 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">
      เมนูการทำงาน (ตามสิทธิ์)
    </div>
    <nav id="sidebarMenuContainer" class="space-y-0.5 px-2 text-xs">
      <!-- Dynamically populated buttons -->
    </nav>
  </div>
</div>

<!-- Bottom Section: User Identity & Logout Button -->
<div class="p-3 border-t border-slate-800 space-y-3 bg-slate-950/40">
  <!-- User Info Card -->
  <div class="flex items-center space-x-2.5 px-2 py-1.5">
    <div id="sidebarUserAvatar" class="w-8 h-8 rounded-full bg-slate-800 text-white font-mono font-bold text-xs flex items-center justify-center border border-slate-700">
      U
    </div>
    <div class="flex-1 min-w-0">
      <div id="sidebarUsernameText" class="text-xs font-semibold text-white truncate">-</div>
      <div id="sidebarEmployeeIdText" class="text-[10px] text-slate-400 font-mono truncate">-</div>
    </div>
  </div>

  <!-- Sign Out Button -->
  <button 
    type="button" 
    onclick="handleLogout()" 
    class="w-full py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-medium rounded transition-colors cursor-pointer border border-slate-700/80 flex items-center justify-center space-x-2"
  >
    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
    </svg>
    <span>ลงชื่อออกจากระบบ</span>
  </button>
</div>
