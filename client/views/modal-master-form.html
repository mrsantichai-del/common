<div class="bg-white rounded-xl w-full max-w-2xl p-6 shadow-2xl border border-slate-200 space-y-4 relative overflow-visible my-auto">
  <div class="flex justify-between items-center border-b border-slate-200 pb-3">
    <div>
      <h3 id="masterModalTitle" class="font-bold text-sm text-slate-900">เพิ่มข้อมูลในตาราง</h3>
      <p id="masterModalSubtitle" class="text-xs text-slate-500">กรุณากรอกข้อมูลให้ครบถ้วน</p>
    </div>
    <button type="button" onclick="closeMasterModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg leading-none cursor-pointer">&times;</button>
  </div>

  <form onsubmit="handleMasterFormSubmit(event)" class="space-y-4 overflow-visible">
    <input type="hidden" id="masterFormRecordId">
    <div id="masterFormFieldsContainer" class="space-y-4 overflow-visible">
      <!-- Dynamic Form Fields Generated Based on Active Table -->
    </div>

    <div class="flex justify-end space-x-2 pt-4 border-t border-slate-200">
      <button type="button" onclick="closeMasterModal()" class="px-3.5 py-1.5 border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-medium rounded cursor-pointer">
        ยกเลิก
      </button>
      <button type="submit" id="btnMasterModalSubmit" class="px-4 py-1.5 bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs rounded transition-colors cursor-pointer shadow-xs">
        บันทึกข้อมูล
      </button>
    </div>
  </form>
</div>
