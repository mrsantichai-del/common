<!-- Organization Structure View (Visual Org Chart & Management) -->
<div class="space-y-4">
  <!-- Top Corporate & Org Summary Banner -->
  <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-2xs">
    <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
      <div class="flex items-center space-x-3.5">
        <div class="w-12 h-12 rounded-lg border border-slate-200 bg-white p-1 flex items-center justify-center flex-shrink-0 shadow-2xs overflow-hidden">
          <img id="orgChartCompanyLogo" src="/assets/logo/logo.jpg" alt="Logo" class="max-w-full max-h-full object-contain">
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h2 id="orgChartCompanyName" class="text-base font-bold text-slate-900">ผังโครงสร้างองค์กร (Organization Structure)</h2>
            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-blue-50 text-blue-700 border border-blue-200">ACTIVE</span>
          </div>
          <p id="orgChartCompanySub" class="text-xs text-slate-500 mt-0.5">แผนผังสายการบังคับบัญชา และการจัดหมวดหมู่หน่วยงาน สาขา ฝ่าย แผนก และตำแหน่งงาน</p>
        </div>
      </div>

      <!-- Quick Metrics Counters -->
      <div class="flex items-center space-x-2 sm:space-x-3 w-full lg:w-auto overflow-x-auto">
        <div class="bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2 text-center flex-1 lg:flex-initial min-w-[100px]">
          <div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">หน่วยงาน</div>
          <div id="statTotalUnits" class="text-lg font-bold text-blue-600 font-mono">0</div>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2 text-center flex-1 lg:flex-initial min-w-[100px]">
          <div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">ตำแหน่งงาน</div>
          <div id="statTotalPositions" class="text-lg font-bold text-indigo-600 font-mono">0</div>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2 text-center flex-1 lg:flex-initial min-w-[100px]">
          <div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">ผู้ครองตำแหน่ง</div>
          <div id="statTotalEmployees" class="text-lg font-bold text-emerald-600 font-mono">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controls Toolbar -->
  <div class="bg-white p-3.5 rounded-lg border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-3 shadow-2xs">
    <div class="flex items-center space-x-2 w-full md:w-auto flex-1 max-w-lg">
      <div class="relative w-full">
        <input 
          type="text" 
          id="orgChartSearchInput" 
          oninput="handleOrgChartSearch(event)"
          placeholder="ค้นหาชื่อหน่วยงาน, ตำแหน่งงาน, หรือรหัส..." 
          class="w-full pl-8 pr-3 py-1.5 rounded border border-slate-300 text-xs bg-slate-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900 transition-colors"
        />
        <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <select 
        id="orgChartTypeFilter" 
        onchange="handleOrgChartFilter(event)" 
        class="px-2.5 py-1.5 rounded border border-slate-300 text-xs bg-white text-slate-700 focus:outline-none focus:ring-1 focus:ring-slate-900 cursor-pointer"
      >
        <option value="ALL">ทุกประเภทหน่วยงาน</option>
        <option value="BRANCH">สาขา (BRANCH)</option>
        <option value="DIVISION">ฝ่าย (DIVISION)</option>
        <option value="DEPARTMENT">แผนก (DEPARTMENT)</option>
        <option value="SECTION">ส่วนงาน (SECTION)</option>
      </select>
    </div>

    <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
      <button 
        type="button" 
        onclick="toggleAllOrgTree(true)" 
        class="px-2.5 py-1.5 text-xs font-medium rounded border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition-colors cursor-pointer"
        title="ขยายทุกหน่วยงาน"
      >
        <span>ขยายทั้งหมด</span>
      </button>

      <button 
        type="button" 
        onclick="toggleAllOrgTree(false)" 
        class="px-2.5 py-1.5 text-xs font-medium rounded border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition-colors cursor-pointer"
        title="ย่อทุกหน่วยงาน"
      >
        <span>ย่อทั้งหมด</span>
      </button>

      <button 
        type="button" 
        onclick="loadOrgChartData()" 
        class="px-3 py-1.5 text-xs font-medium rounded border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition-colors flex items-center space-x-1.5 cursor-pointer"
        title="รีเฟรชข้อมูลผังโครงสร้าง"
      >
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>รีเฟรช</span>
      </button>

      <div class="h-4 w-px bg-slate-300 mx-1"></div>

      <!-- Quick Links to MasterData Tables -->
      <button 
        type="button" 
        onclick="navigateToMasterTable('orgunit')" 
        class="px-2.5 py-1.5 text-xs font-medium rounded border border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-700 transition-colors cursor-pointer flex items-center space-x-1"
        title="เปิดจัดการหน่วยงานในตาราง MasterData"
      >
        <svg class="w-3 h-3 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
        <span>หน่วยงาน</span>
      </button>
      <button 
        type="button" 
        onclick="navigateToMasterTable('job')" 
        class="px-2.5 py-1.5 text-xs font-medium rounded border border-teal-200 bg-teal-50 hover:bg-teal-100 text-teal-700 transition-colors cursor-pointer flex items-center space-x-1"
        title="เปิดจัดการลักษณะงานในตาราง MasterData"
      >
        <svg class="w-3 h-3 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
        <span>ลักษณะงาน</span>
      </button>
      <button 
        type="button" 
        onclick="navigateToMasterTable('position')" 
        class="px-2.5 py-1.5 text-xs font-medium rounded border border-purple-200 bg-purple-50 hover:bg-purple-100 text-purple-700 transition-colors cursor-pointer flex items-center space-x-1"
        title="เปิดจัดการตำแหน่งงานในตาราง MasterData"
      >
        <svg class="w-3 h-3 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        <span>ตำแหน่งงาน</span>
      </button>
    </div>
  </div>

  <!-- Org Chart Interactive Visual Container -->
  <div class="bg-slate-100/70 p-4 md:p-6 rounded-xl border border-slate-200 min-h-[500px] overflow-x-auto shadow-inner">
    <div id="orgChartContentContainer" class="space-y-8 min-w-[720px]">
      <div class="p-12 text-center text-xs text-slate-400 font-sans">
        กำลังโหลดผังโครงสร้างองค์กร...
      </div>
    </div>
  </div>
</div>
