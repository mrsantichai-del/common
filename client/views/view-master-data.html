<!-- Table Selection Tabs -->
<div class="border-b border-slate-200 flex items-center space-x-1 overflow-x-auto">
  <button type="button" onclick="switchMasterTable('company')" id="masterTab_company" class="px-4 py-2.5 text-xs font-semibold border-b-2 border-blue-600 text-blue-700 bg-white rounded-t transition-colors cursor-pointer flex items-center space-x-1.5 flex-shrink-0">
    <span>บริษัท (Company)</span>
    <span id="tabCount_company" class="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.2 rounded-full font-mono">-</span>
  </button>
  <button type="button" onclick="switchMasterTable('user')" id="masterTab_user" class="px-4 py-2.5 text-xs font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition-colors cursor-pointer flex items-center space-x-1.5 flex-shrink-0">
    <span>ผู้ใช้งาน (User)</span>
    <span id="tabCount_user" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded-full font-mono">-</span>
  </button>
  <button type="button" onclick="switchMasterTable('group')" id="masterTab_group" class="px-4 py-2.5 text-xs font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition-colors cursor-pointer flex items-center space-x-1.5 flex-shrink-0">
    <span>กลุ่มสิทธิ์ (Group)</span>
    <span id="tabCount_group" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded-full font-mono">-</span>
  </button>
  <button type="button" onclick="switchMasterTable('permission')" id="masterTab_permission" class="px-4 py-2.5 text-xs font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition-colors cursor-pointer flex items-center space-x-1.5 flex-shrink-0">
    <span>สิทธิ์การใช้งาน (Permission)</span>
    <span id="tabCount_permission" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded-full font-mono">-</span>
  </button>
  <button type="button" onclick="switchMasterTable('document')" id="masterTab_document" class="px-4 py-2.5 text-xs font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition-colors cursor-pointer flex items-center space-x-1.5 flex-shrink-0">
    <span>เอกสาร (Document)</span>
    <span id="tabCount_document" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded-full font-mono">-</span>
  </button>
  <button type="button" onclick="switchMasterTable('auditlog')" id="masterTab_auditlog" class="px-4 py-2.5 text-xs font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition-colors cursor-pointer flex items-center space-x-1.5 flex-shrink-0">
    <span>ประวัติ (AuditLog)</span>
    <span id="tabCount_auditlog" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded-full font-mono">-</span>
  </button>
</div>

<!-- Controls Toolbar: Search & Action Buttons -->
<div class="bg-white p-3.5 rounded-lg border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-3 shadow-2xs">
  <div class="flex items-center space-x-3 w-full md:w-auto flex-1 max-w-md">
    <div class="relative w-full">
      <input 
        type="text" 
        id="masterSearchInput" 
        oninput="handleMasterSearchInput(event)"
        placeholder="ค้นหาข้อมูลในตารางนี้..." 
        class="w-full pl-8 pr-3 py-1.5 rounded border border-slate-300 text-xs bg-slate-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900 transition-colors"
      />
      <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>
  </div>

  <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
    <button 
      type="button" 
      onclick="loadMasterTableData()" 
      class="px-3 py-1.5 text-xs font-medium rounded border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition-colors flex items-center space-x-1.5 cursor-pointer shadow-2xs"
      title="รีเฟรชข้อมูล"
    >
      <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span>รีเฟรช</span>
    </button>

    <button 
      type="button" 
      onclick="exportCurrentMasterTableToExcel()" 
      class="px-3 py-1.5 text-xs font-medium rounded border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 transition-colors flex items-center space-x-1.5 cursor-pointer shadow-2xs"
      title="ส่งออกข้อมูลตารางปัจจุบันเป็นไฟล์ Excel (CSV UTF-8)"
    >
      <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span>ส่งออก Excel</span>
    </button>

    <button 
      type="button" 
      id="btnMasterCreate" 
      onclick="openCreateMasterRecordModal()" 
      class="px-3.5 py-1.5 text-xs font-medium rounded bg-slate-900 hover:bg-slate-800 text-white transition-colors flex items-center space-x-1.5 cursor-pointer shadow-xs"
    >
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>เพิ่มข้อมูลใหม่</span>
    </button>
  </div>
</div>

<!-- Master Data Table Container -->
<div class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-2xs">
  <div class="overflow-x-auto">
    <table class="w-full text-left text-xs border-collapse">
      <thead id="masterTableThead" class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
        <!-- Dynamic Headers -->
      </thead>
      <tbody id="masterTableTbody" class="divide-y divide-slate-200 text-slate-700 font-mono">
        <!-- Dynamic Rows -->
      </tbody>
    </table>
  </div>

  <!-- Footer summary -->
  <div class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
    <div id="masterTableCountText">แสดง 0 รายการ</div>
    <div class="text-[11px] font-mono text-slate-400">TABLE: <span id="masterCurrentTableName" class="font-bold text-slate-700">USER</span></div>
  </div>
</div>
