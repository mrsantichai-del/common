<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBAC Authentication System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-6">
  <header class="w-full max-w-4xl py-6 border-b border-slate-800 flex justify-between items-center mb-8">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="text-indigo-400">⚡</span> RBAC Access Control
      </h1>
      <p class="text-xs text-slate-400">NestJS + Prisma ORM + Supabase PostgreSQL</p>
    </div>
    <div id="authStatus" class="text-sm font-medium text-slate-400">
      Status: <span class="text-amber-400">Guest (Not logged in)</span>
    </div>
  </header>

  <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Auth Box -->
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-6 shadow-xl">
      <div class="flex border-b border-slate-700 pb-3 mb-6 gap-4">
        <button id="tabLogin" class="text-sm font-semibold text-indigo-400 border-b-2 border-indigo-400 pb-1" onclick="switchTab('login')">Sign In</button>
        <button id="tabRegister" class="text-sm font-semibold text-slate-400 hover:text-slate-200 pb-1" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Username</label>
          <input type="text" id="loginUsername" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition duration-150">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Username</label>
          <input type="text" id="regUsername" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Password (min 6 chars)</label>
          <input type="password" id="regPassword" minlength="6" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Role</label>
          <select id="regRole" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            <option value="USER">USER (Normal)</option>
            <option value="ADMIN">ADMIN (Privileged)</option>
          </select>
        </div>
        <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg transition duration-150">Create Account</button>
      </form>

      <div id="logoutSection" class="mt-4 pt-4 border-t border-slate-700 hidden flex justify-between items-center">
        <span class="text-xs text-slate-400">Current Token stored in localStorage</span>
        <button onclick="handleLogout()" class="text-xs text-rose-400 hover:underline">Log out</button>
      </div>
    </div>

    <!-- RBAC Verification Dashboard -->
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-6 shadow-xl flex flex-col">
      <h2 class="text-lg font-semibold text-white mb-2">RBAC Permission Testing</h2>
      <p class="text-xs text-slate-400 mb-6">กดทดสอบเพื่อเรียกดู Endpoint ที่มี Guard แตกต่างกัน</p>

      <div class="space-y-3">
        <button onclick="testEndpoint('/users/profile')" class="w-full text-left p-3 rounded-lg bg-slate-900 hover:bg-slate-850 border border-slate-700 flex justify-between items-center group">
          <div>
            <div class="font-medium text-sm text-slate-200">1. User Profile</div>
            <div class="text-xs text-slate-500">Role Required: Authenticated (USER or ADMIN)</div>
          </div>
          <span class="text-xs px-2 py-1 bg-blue-900/60 text-blue-300 rounded border border-blue-700">Test</span>
        </button>

        <button onclick="testEndpoint('/users/admin-panel')" class="w-full text-left p-3 rounded-lg bg-slate-900 hover:bg-slate-850 border border-slate-700 flex justify-between items-center group">
          <div>
            <div class="font-medium text-sm text-slate-200">2. Admin Control Room</div>
            <div class="text-xs text-amber-500 font-medium">Role Required: ADMIN ONLY</div>
          </div>
          <span class="text-xs px-2 py-1 bg-amber-900/60 text-amber-300 rounded border border-amber-700">Test</span>
        </button>

        <button onclick="testEndpoint('/users/all')" class="w-full text-left p-3 rounded-lg bg-slate-900 hover:bg-slate-850 border border-slate-700 flex justify-between items-center group">
          <div>
            <div class="font-medium text-sm text-slate-200">3. List All Users Data</div>
            <div class="text-xs text-amber-500 font-medium">Role Required: ADMIN ONLY</div>
          </div>
          <span class="text-xs px-2 py-1 bg-amber-900/60 text-amber-300 rounded border border-amber-700">Test</span>
        </button>
      </div>

      <!-- Result Box -->
      <div class="mt-6 flex-1 flex flex-col">
        <div class="text-xs uppercase tracking-wider text-slate-400 mb-1 flex justify-between">
          <span>Server Response</span>
          <span id="responseStatus" class="font-mono font-bold"></span>
        </div>
        <pre id="output" class="flex-1 w-full p-3 bg-black/60 rounded-lg text-xs font-mono text-emerald-400 overflow-x-auto min-h-[140px] border border-slate-800">Waiting for request...</pre>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.origin;

    function getToken() {
      return localStorage.getItem('token');
    }

    function setToken(token) {
      if (token) {
        localStorage.setItem('token', token);
      } else {
        localStorage.removeItem('token');
      }
      updateUI();
    }

    function updateUI() {
      const token = getToken();
      const statusEl = document.getElementById('authStatus');
      const logoutSec = document.getElementById('logoutSection');

      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          statusEl.innerHTML = `Signed in as <strong class="text-white">${payload.username}</strong> | Role: <span class="px-2 py-0.5 rounded text-xs ${payload.role === 'ADMIN' ? 'bg-amber-900/80 text-amber-300 border border-amber-600' : 'bg-blue-900/80 text-blue-300 border border-blue-600'}">${payload.role}</span>`;
          logoutSec.classList.remove('hidden');
        } catch (e) {
          statusEl.innerHTML = `<span class="text-emerald-400">Token Available</span>`;
        }
      } else {
        statusEl.innerHTML = `Status: <span class="text-amber-400">Guest (Not logged in)</span>`;
        logoutSec.classList.add('hidden');
      }
    }

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = 'text-sm font-semibold text-indigo-400 border-b-2 border-indigo-400 pb-1';
        tabRegister.className = 'text-sm font-semibold text-slate-400 hover:text-slate-200 pb-1';
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabRegister.className = 'text-sm font-semibold text-indigo-400 border-b-2 border-indigo-400 pb-1';
        tabLogin.className = 'text-sm font-semibold text-slate-400 hover:text-slate-200 pb-1';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        showResponse(res.status, data);

        if (res.ok && data.accessToken) {
          setToken(data.accessToken);
        }
      } catch (err) {
        showResponse(500, { error: err.message });
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        const data = await res.json();
        showResponse(res.status, data);

        if (res.ok) {
          switchTab('login');
          document.getElementById('loginUsername').value = username;
        }
      } catch (err) {
        showResponse(500, { error: err.message });
      }
    }

    function handleLogout() {
      setToken(null);
      showResponse(200, { message: 'Logged out successfully' });
    }

    async function testEndpoint(endpoint) {
      const token = getToken();
      const headers = {};
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      try {
        const res = await fetch(`${API_BASE}${endpoint}`, { headers });
        const data = await res.json();
        showResponse(res.status, data);
      } catch (err) {
        showResponse(500, { error: err.message });
      }
    }

    function showResponse(status, data) {
      const output = document.getElementById('output');
      const statusEl = document.getElementById('responseStatus');

      statusEl.textContent = `HTTP ${status}`;
      if (status >= 200 && status < 300) {
        statusEl.className = 'font-mono font-bold text-emerald-400';
        output.className = 'flex-1 w-full p-3 bg-black/60 rounded-lg text-xs font-mono text-emerald-400 overflow-x-auto min-h-[140px] border border-emerald-900/50';
      } else if (status === 401 || status === 403) {
        statusEl.className = 'font-mono font-bold text-rose-400';
        output.className = 'flex-1 w-full p-3 bg-black/60 rounded-lg text-xs font-mono text-rose-400 overflow-x-auto min-h-[140px] border border-rose-900/50';
      } else {
        statusEl.className = 'font-mono font-bold text-amber-400';
        output.className = 'flex-1 w-full p-3 bg-black/60 rounded-lg text-xs font-mono text-amber-400 overflow-x-auto min-h-[140px] border border-amber-900/50';
      }

      output.textContent = JSON.stringify(data, null, 2);
    }

    updateUI();
  </script>
</body>
</html>
